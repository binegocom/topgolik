name: iOS Simulator CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate iOS runner
        run: |
          flutter pub get
          flutter create --platforms=ios --project-name topgolik --org com.binego .
      - name: Analyze and test Flutter source
        run: |
          flutter analyze
          flutter test
      - name: Build unsigned iOS simulator app
        run: flutter build ios --simulator --no-codesign --debug --dart-define=TOPGOLIK_API_URL=https://api.topgolik.com/api/v1
      - name: Package unsigned simulator app
        run: tar -C build/ios/iphonesimulator -czf topgolik-ios-simulator.tar.gz Runner.app
      - name: Save iOS simulator build
        uses: actions/upload-artifact@v4
        with:
          name: topgolik-ios-simulator
          path: app/topgolik-ios-simulator.tar.gz
          if-no-files-found: error
          retention-days: 7
